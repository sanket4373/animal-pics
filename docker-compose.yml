services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: animaluser
      POSTGRES_PASSWORD: animalpass
      POSTGRES_DB: animalpics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animaluser -d animalpics"]
      interval: 5s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
  app:
    image: sanket4373/animal-pics:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://animaluser:animalpass@db:5432/animalpics
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: animal-pictures
      MINIO_SECURE: "false"
      ENV: production
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
volumes:
  postgres_data:
  minio_data: