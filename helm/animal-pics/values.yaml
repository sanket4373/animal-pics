# Application configuration
image:
  repository: sanket4373/animal-pics
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# PostgreSQL configuration (using official postgres:15-alpine image)
postgres:
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: postgres
    password: postgres
    database: animals
  persistence:
    enabled: false      # Set to true when a StorageClass is available
    size: 1Gi
    storageClass: ""    # Empty = use cluster default StorageClass

# MinIO configuration (using official minio/minio:latest image)
minio:
  image:
    repository: minio/minio
    tag: latest
    pullPolicy: IfNotPresent
  auth:
    rootUser: minioadmin
    rootPassword: minioadmin
  persistence:
    enabled: false      # Set to true when a StorageClass is available
    size: 5Gi
    storageClass: ""    # Empty = use cluster default StorageClass

# Application environment variables
# These will be injected into the app deployment
env:
  ENV: production
  MINIO_BUCKET: animal-pictures
  MINIO_SECURE: "false"
  # Service names are auto-generated: <release-name>-<subchart-name>
  # For example: animal-pics-minio:9000
  MINIO_ENDPOINT: "{{ .Release.Name }}-minio:9000"

database:
  # Service name is auto-generated: <release-name>-postgresql
  # For example: animal-pics-postgresql:5432
  url: "postgresql://postgres:postgres@{{ .Release.Name }}-postgresql:5432/animals"
