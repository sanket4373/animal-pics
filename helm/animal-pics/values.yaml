image:
  repository: animal-pics-app
  tag: local
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8000

env:
  ENV: production
  MINIO_BUCKET: animal-pictures
  MINIO_SECURE: "false"
  MINIO_ENDPOINT: minio:9000

database:
  url: "postgresql://postgres:postgres@postgresql:5432/animals"

minio:
  accessKey: "minioadmin"
  secretKey: "minioadmin"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
