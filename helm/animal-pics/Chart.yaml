apiVersion: v2
name: animal-pics
description: A Helm chart for the Animal Picture Microservice
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: postgresql
    version: "15.5.38"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  
  - name: minio
    version: "14.8.4"
    repository: "https://charts.min.io/"
    condition: minio.enabled

